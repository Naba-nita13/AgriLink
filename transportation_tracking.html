<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transportation Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #e0f7f5;
    }

    /* Top bar with logo and username */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2e8b8b;
      color: white;
      padding: 20px 30px;
    }

    .top-bar .logo img {
      height: 55px;
    }

    .top-bar .username {
      font-size: 22px;
      font-weight: bold;
    }

    /* Navigation bar */
    nav {
      background: #145f5f;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 14px 24px;
      display: block;
      transition: 0.3s;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #2e8b8b;
      color: #fff;
    }

    header h1 {
      text-align: center;
      margin: 25px 0;
      color: #006d6d;
    }

    section {
      margin: 20px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
    }

    #search-section input {
      padding: 10px;
      width: 220px;
    }

    #search-section button {
      padding: 10px 18px;
      background: #2e8b8b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #map {
      height: 400px;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    th {
      background: #ccf0ea;
      color: #2e8b8b;
    }

    footer {
      background: #1d4f4f;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo">
      <img src="logo.jpg" alt="Logo" />
    </div>
    <div class="username">👤 Supervisor</div>
  </div>

  <!-- Navigation Bar -->
  <nav>
    <a href="#">Dashboard</a>
    <a href="#">Grading Standards</a>
    <a href="#">Packaging</a>
    <a href="#">Tracking</a>
    <a href="#">Inspector Reports</a>
    <a href="#">Quality Trends</a>
  </nav>

  <!-- Page Title -->
  <header>
    <h1>Transportation Tracking System</h1>
  </header>

  <!-- Search Section -->
  <section id="search-section">
    <h2>Search Vehicle</h2>
    <input type="text" id="vehicle-number" placeholder="Enter Vehicle Number">
    <button onclick="searchVehicle()">Search</button>
  </section>

  <!-- Vehicle Info -->
  <section id="info-section">
    <h2>Vehicle Route Information</h2>
    <table>
      <thead>
        <tr>
          <th>Vehicle Number</th>
          <th>Start Location</th>
          <th>End Location</th>
        </tr>
      </thead>
      <tbody id="vehicle-info">
        <tr><td colspan="3">No data available</td></tr>
      </tbody>
    </table>
  </section>

  <!-- Map Section -->
  <section id="map-section">
    <h2>Live Location</h2>
    <div id="map"></div>
  </section>

  <footer>
    &copy; 2025 Agricultural Management System
  </footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([23.8103, 90.4125], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var marker = L.marker([23.8103, 90.4125]).addTo(map)
        .bindPopup('Waiting for vehicle search...')
        .openPopup();

    function searchVehicle() {
      var vehicleNumber = document.getElementById('vehicle-number').value;
      var vehicleData = {
        "V1": {start: "Dhaka", end: "Chittagong", location: [22.3569, 91.7832]},
        "v2": {start: "Sylhet", end: "Khulna", location: [22.815, 89.568]},
        "v3": {start: "Rajshahi", end: "Barishal", location: [22.701, 90.353]}
      };

      if (vehicleData[vehicleNumber]) {
        var data = vehicleData[vehicleNumber];
        document.getElementById("vehicle-info").innerHTML = `
          <tr>
            <td>${vehicleNumber}</td>
            <td>${data.start}</td>
            <td>${data.end}</td>
          </tr>
        `;

        marker.setLatLng(data.location)
              .bindPopup(`Vehicle ${vehicleNumber} Live Location`)
              .openPopup();
        map.setView(data.location, 10);
      } else {
        alert("Vehicle not found!");
      }
    }
  </script>
</body>
</html>
